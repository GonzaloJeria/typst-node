[package]
name = "typst-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Long-lived Typst compiler process for typst-compiler (JSON lines over stdio)"
publish = false

[dependencies]
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
comemo = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
