<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="bootstrap">
<style>@page { size: A4; margin: 15mm }</style>
</head>
<body>
  <div class="container-fluid">
    <h1 class="h3 mb-3">Reporte mensual <small class="text-body-secondary">Septiembre 2026</small></h1>
    <div class="alert alert-info" role="alert">Las ventas subieron un <strong>12%</strong> respecto al mes anterior.</div>

    <div class="row g-3 mb-3">
      <div class="col-4">
        <div class="card text-bg-primary">
          <div class="card-body">
            <h5 class="card-title">Ventas</h5>
            <p class="card-text fs-4 fw-bold">$4.2M</p>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Clientes</h5>
            <p class="card-text fs-4 fw-bold">318</p>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card border-success">
          <div class="card-body text-success">
            <h5 class="card-title">Margen</h5>
            <p class="card-text fs-4 fw-bold">34%</p>
          </div>
        </div>
      </div>
    </div>

    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr><th>Región</th><th class="text-end">Ventas</th><th class="text-end">Variación</th></tr>
      </thead>
      <tbody>
        <tr><td>Metropolitana</td><td class="text-end">$2.100.000</td><td class="text-end"><span class="badge bg-success">+15%</span></td></tr>
        <tr><td>Valparaíso</td><td class="text-end">$900.000</td><td class="text-end"><span class="badge bg-success">+8%</span></td></tr>
        <tr><td>Biobío</td><td class="text-end">$700.000</td><td class="text-end"><span class="badge bg-danger">-3%</span></td></tr>
        <tr><td>Otras</td><td class="text-end">$500.000</td><td class="text-end"><span class="badge bg-secondary">0%</span></td></tr>
      </tbody>
    </table>

    <ul class="list-group">
      <li class="list-group-item d-flex justify-content-between align-items-center">Pedidos nuevos <span class="badge text-bg-primary rounded-pill">14</span></li>
      <li class="list-group-item d-flex justify-content-between align-items-center">Devoluciones <span class="badge text-bg-primary rounded-pill">2</span></li>
    </ul>
  </div>
</body>
</html>
