name: Release

# Builds typst-sidecar for every platform package in npm/, then publishes all
# @gjeria packages whose version is not on npm yet (changeset publish).
# Linux and Windows binaries are cross-compiled on one Linux runner
# (cargo-zigbuild); both macOS binaries come from a single macOS runner,
# which needs Apple's SDK to link. macOS runners bill 10x the minutes.
# Run it from the Actions tab after merging a "changeset version" commit.
# Requires the NPM_TOKEN secret (an npm automation token for the @gjeria scope).
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/typst-sidecar
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both macOS binaries
        run: |
          SIDECAR_PKG=typst-sidecar-darwin-arm64 node scripts/build-sidecar.mjs
          SIDECAR_PKG=typst-sidecar-darwin-x64 node scripts/build-sidecar.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: npm/typst-sidecar-darwin-*/bin/
          if-no-files-found: error

  release:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/typst-sidecar
      - run: pip install cargo-zigbuild==0.23.4 ziglang==0.14.1
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu
      - name: Build the Linux and Windows binaries
        run: |
          for pkg in linux-x64 linux-arm64 win32-x64; do
            SIDECAR_PKG=typst-sidecar-$pkg SIDECAR_CARGO=zigbuild node scripts/build-sidecar.mjs
          done
      - uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: npm/
      - run: chmod +x npm/*/bin/* && file npm/*/bin/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Tests use the freshly built linux-x64 sidecar.
      - run: pnpm test
      - run: pnpm build
      # The packages as npm will get them, installed in an empty project.
      - name: Package smoke test
        run: node scripts/smoke-pack.mjs
      - name: Publish
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # Tags for the current versions. changeset publish also tries to create
      # them, but `git tag -m` needs a committer identity, which the runner
      # lacks, and changesets ignores the failure. `changeset tag` skips tags
      # that already exist, so re-running Release after a publish adds them.
      - name: Tag and push release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset tag
          git tag -l '@gjeria/*'
          git push origin --tags
