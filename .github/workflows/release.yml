name: Release

# Builds typst-sidecar for every platform package in npm/, then publishes all
# @gjeria packages whose version is not on npm yet (changeset publish).
# Run it from the Actions tab after merging a "changeset version" commit.
# Requires the NPM_TOKEN secret (an npm automation token for the @gjeria scope).
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: typst-sidecar-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, pkg: typst-sidecar-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, pkg: typst-sidecar-darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, pkg: typst-sidecar-darwin-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: typst-sidecar-win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          export CC_x86_64_unknown_linux_musl=musl-gcc CC_aarch64_unknown_linux_musl=musl-gcc
          cargo build --release --locked --target ${{ matrix.target }} --manifest-path crates/typst-sidecar/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: |
            crates/typst-sidecar/target/${{ matrix.target }}/release/typst-sidecar
            crates/typst-sidecar/target/${{ matrix.target }}/release/typst-sidecar.exe
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Place binaries in the platform packages
        run: |
          for dir in artifacts/*/; do
            pkg=$(basename "$dir")
            mkdir -p "npm/$pkg/bin"
            cp "$dir"/typst-sidecar* "npm/$pkg/bin/"
            chmod +x "npm/$pkg/bin/"typst-sidecar*
          done
          ls -la npm/*/bin
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Tests use the freshly built linux-x64 sidecar.
      - run: pnpm test
      - run: pnpm build
      - name: Publish
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Push release tags
        run: git push --follow-tags
