name: Release

# Cross-compiles typst-sidecar for every platform package in npm/ from one
# Linux runner (cargo-zigbuild), then publishes all @gjeria packages whose
# version is not on npm yet (changeset publish). macOS and Windows runners
# bill 10x and 2x the minutes, so none are used.
# Run it from the Actions tab after merging a "changeset version" commit.
# Requires the NPM_TOKEN secret (an npm automation token for the @gjeria scope).
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/typst-sidecar
      - run: pip install cargo-zigbuild==0.23.4 ziglang==0.14.1
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnu
      - name: Build typst-sidecar for every platform
        run: |
          for pkg in npm/typst-sidecar-*/; do
            SIDECAR_PKG=$(basename "$pkg") SIDECAR_CARGO=zigbuild node scripts/build-sidecar.mjs
          done
          file npm/*/bin/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Tests use the freshly built linux-x64 sidecar.
      - run: pnpm test
      - run: pnpm build
      - name: Publish
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Push release tags
        run: git push --follow-tags
