name: typst-sidecar release

# Builds prebuilt typst-sidecar binaries and attaches them to a GitHub release.
# Trigger by pushing a tag such as `sidecar-v0.1.0`.
on:
  push:
    tags: ["sidecar-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path crates/typst-sidecar/Cargo.toml
      - name: Package
        shell: bash
        run: |
          dir=crates/typst-sidecar/target/${{ matrix.target }}/release
          name=typst-sidecar-${{ matrix.target }}
          if [ -f "$dir/typst-sidecar.exe" ]; then
            7z a "$name.zip" "./$dir/typst-sidecar.exe"
          else
            tar -czf "$name.tar.gz" -C "$dir" typst-sidecar
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: typst-sidecar-*
