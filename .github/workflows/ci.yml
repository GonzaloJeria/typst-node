name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Must match packages/pdf/test/visual/__goldens__/TYPST_VERSION.
  TYPST_VERSION: 0.15.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Typst ${{ env.TYPST_VERSION }}
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/typst-sidecar/target
          key: sidecar-${{ runner.os }}-${{ hashFiles('crates/typst-sidecar/Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: pnpm install --frozen-lockfile
      # The same static binary the npm platform package ships.
      - name: Build typst-sidecar
        run: pnpm sidecar:build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: pnpm typecheck
      - run: pnpm test
      - name: Visual regression on the sidecar backend
        run: pnpm vitest run packages/pdf/test/visual.test.ts
        env:
          VISUAL_BACKEND: sidecar
      - run: pnpm build
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: packages/pdf/test/visual/__diff__/
