name: CI

# Pull requests only: a merge to main was already tested as the PR's merge
# commit. Docs-only changes skip CI, and a new push cancels the older run.
on:
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".changeset/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match packages/pdf/test/visual/__goldens__/TYPST_VERSION.
  TYPST_VERSION: 0.15.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Typst ${{ env.TYPST_VERSION }}
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      # Restores compiled dependencies even when Cargo.lock changes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/typst-sidecar
      - run: pip install cargo-zigbuild==0.23.4 ziglang==0.14.1
      - run: rustup target add x86_64-unknown-linux-musl
      - run: pnpm install --frozen-lockfile
      # The static binary the npm platform package ships, built without LTO
      # (the `ci` profile) because tests don't need the last few percent.
      - name: Build typst-sidecar
        run: pnpm sidecar:build
        env:
          SIDECAR_PROFILE: ci
          SIDECAR_CARGO: zigbuild
      - run: pnpm typecheck
      - run: pnpm test
      - name: Visual regression on the sidecar backend
        run: pnpm vitest run packages/pdf/test/visual.test.ts
        env:
          VISUAL_BACKEND: sidecar
      - run: pnpm build
      # Packs the packages and installs them in an empty project (ESM, CJS, CLI).
      - name: Package smoke test
        run: node scripts/smoke-pack.mjs
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: packages/pdf/test/visual/__diff__/
