name: Tag release

# Creates and pushes the git tags for the current package versions
# (`@gjeria/<package>@<version>`) without building or publishing. Use it when
# a Release run published to npm but could not push its tags. With `ref`,
# tags the versions found at that commit (an older release).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to tag (default the selected branch)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag and push release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset tag
          git tag -l '@gjeria/*'
          git push origin --tags
